apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: kccm
rules:
- apiGroups: 
  - kubevirt.io
  resources: 
  - virtualmachines
  verbs: 
  - get
  - watch
  - list
- apiGroups: 
  - kubevirt.io
  resources: 
  - virtualmachineinstances
  verbs: 
  - get
  - watch
  - list
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - "*"
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
